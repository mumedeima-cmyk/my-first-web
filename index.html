<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Result System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Student Result System</h1>

        <form id="resultForm">

            <label>Student Name</label>
            <input type="text" id="studentName" required>

            <label>Mathematics</label>
            <input type="number" id="math" min="0" max="100" required>

            <label>English</label>
            <input type="number" id="english" min="0" max="100" required>

            <label>Basic Science</label>
            <input type="number" id="science" min="0" max="100" required>
            
            <label>Agricultural Science</label>
            <input type="number" id="agriculturalScience" min="0" max="100" required>
            <label>Home Economics</label>
            <input type="number" id="homeEconomics" min="0" max="100" required>

            <label>Basic Technology</label>
            <input type="number" id="basicTechnology" min="0" max="100" required>

            <label>Computer Studies</label>
            <input type="number" id="computerStudies" min="0" max="100" required>

            <label>Business Studies</label>
            <input type="number" id="businessStudies" min="0" max="100" required>

            <label>History</label>
            <input type="number" id="history" min="0" max="100" required>

            <label>Literature in English</label>
            <input type="number" id="literature" min="0" max="100" required>

            <label>Cultural and Creative Art</label>
            <input type="number" id="culturalCreativeArt" min="0" max="100" required>

            <label>Social Studies</label>
            <input type="number" id="socialStudies" min="0" max="100" required>

            <label>Christian Religious Studies</label>
            <input type="number" id="christianReligiousStudies" min="0" max="100" required>

            <label>Civic Education</label>
            <input type="number" id="civicEducation" min="0" max="100" required>

            <label>Physical and Health Education</label>
            <input type="number" id="physicalHealthEducation" min="0" max="100" required>



            <button type="submit">Calculate Result</button>

        </form>

        <div id="result"></div>

    </div>

    <script src="script.js"></script>

</body>
</html>
